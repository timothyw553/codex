[build-system]
requires = ["uv_build>=0.13,<0.14"]
build-backend = "uv_build"

[project]
name = "codex-unitycatalog"
version = "0.1.0"
description = "A Codex workflow for Unity Catalog changes"
requires-python = ">=3.10"
license = "Apache-2.0"
dependencies = ["openai-codex", "pydantic>=2.12"]

[project.scripts]
codex-uc = "codex_uc.cli:main"

[tool.uv.sources]
openai-codex = { path = "../../sdk/python" }

[tool.uv]
default-index = "https://pypi.org/simple"

[tool.uv.build-backend]
module-name = "codex_uc"

[dependency-groups]
dev = ["pytest>=8", "ruff>=0.15.8"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

[tool.ruff]
target-version = "py310"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "B", "C4"]
ignore = ["E501"]
